name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$F" ]; then
            echo "NO se encontró settings.gradle.kts. Archivos del repo:"
            find . -not -path './.git/*' | head -80
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Proyecto encontrado en: $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTV-apk
          path: "**/build/outputs/apk/debug/*.apk"
